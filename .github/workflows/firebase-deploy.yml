name: Deploy to Firebase Hosting

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: firebase-deploy
  cancel-in-progress: false

jobs:
  build_and_deploy:
    name: Build & deploy
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Build (static export)
        run: npm run build

      - name: Deploy Hosting
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_LAVANDA_OBLIK }}
          projectId: lavanda-oblik
          channelId: live
          entryPoint: "."

      # action-hosting-deploy publishes Hosting only — Firestore rules must be
      # deployed separately, else new fields/statuses get rejected by stale rules.
      #
      # NOTE: this needs the service account in FIREBASE_SERVICE_ACCOUNT_LAVANDA_OBLIK
      # to hold roles/firebaserules.admin (the Hosting-only SA returns HTTP 403 on
      # the rules :test endpoint). Until that role is granted, this step is
      # best-effort (continue-on-error) so Hosting deploys still go green; deploy
      # rules manually with: firebase deploy --only firestore:rules.
      - name: Deploy Firestore rules
        continue-on-error: true
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_LAVANDA_OBLIK }}
        run: |
          printf '%s' "$FIREBASE_SERVICE_ACCOUNT" > "$RUNNER_TEMP/firebase-sa.json"
          export GOOGLE_APPLICATION_CREDENTIALS="$RUNNER_TEMP/firebase-sa.json"
          npx --yes firebase-tools deploy --only firestore:rules \
            --project lavanda-oblik --non-interactive
          rm -f "$RUNNER_TEMP/firebase-sa.json"
